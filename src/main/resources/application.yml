server:
  port: 8080

spring:
  application:
    name: singapore-weather-service

# Expose a health endpoint for load balancers / orchestrators (K8s readiness/liveness).
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

weather:
  cache:
    # Readings are considered fresh for 3 seconds; within this window no provider
    # is contacted. Stale entries are still retained for last-resort failover.
    ttl: 3s

  weatherstack:
    enabled: true
    base-url: http://api.weatherstack.com
    api-key: ${WEATHERSTACK_ACCESS_KEY:}
    connect-timeout: 1s
    read-timeout: 2s

  openweathermap:
    enabled: true
    base-url: http://api.openweathermap.org
    api-key: ${OPENWEATHERMAP_API_KEY:}
    connect-timeout: 1s
    read-timeout: 2s

logging:
  level:
    com.example.weather: INFO
